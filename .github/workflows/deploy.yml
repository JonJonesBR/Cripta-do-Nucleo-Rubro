name: Deploy Cripta do Núcleo Rubro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Run Unit Tests
        run: npm run check

      - name: Build Vite Distribution & Singlefile Bundle
        run: |
          npm run build
          npm run single

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp "release/CRIPTA DO NÚCLEO RUBRO (jogo único).html" _site/index.html
          cp public/favicon.svg _site/favicon.svg
          cp public/manifest.webmanifest _site/manifest.webmanifest
          touch _site/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
